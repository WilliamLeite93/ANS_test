version: '3.8'

services:
  db:
    image: postgres:15
    container_name: ans_database
    restart: always
    environment:
      POSTGRES_USER: william_user
      POSTGRES_PASSWORD: ans_password
      POSTGRES_DB: ans_financeiro
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: